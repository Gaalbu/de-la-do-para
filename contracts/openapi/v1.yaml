openapi: 3.1.0
info:
  title: De Lá do Pará API
  version: 0.0.1
  description: >
    Contrato canônico da API (C11). Toda operação HTTP implementada precisa
    estar aqui antes do código; o cliente Angular é gerado deste arquivo e
    nunca editado manualmente. Endpoints de negócio chegam com as specs
    (C15+); este seed prova o gate.
servers:
  - url: http://localhost:8080
    description: API local
security:
  - sessionCookie: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Saúde do processo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Processo está vivo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Processo aceita requisições
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Saúde pública da API
      # Endpoint público: sem sessão (exceção explícita ao padrão).
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: Indisponibilidade transitória
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/accounts:
    post:
      operationId: registerAccount
      summary: Criar conta opcional
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          headers:
            Location:
              schema:
                type: string
              description: URI da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions:
    post:
      operationId: login
      summary: Autenticar e criar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: DLSESSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Consultar sessão atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: logout
      summary: Encerrar sessão
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessão encerrada
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/csrf:
    get:
      operationId: getCsrf
      summary: Obter token CSRF
      security: []
      responses:
        '200':
          description: Token CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/v1/accounts/verify:
    post:
      operationId: verifyEmail
      summary: Verificar e-mail (placeholder C15 — verifica via token)
      security: []
      responses:
        '200':
          description: Verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /api/v1/accounts/recovery:
    post:
      operationId: requestRecovery
      summary: Solicitar recuperação (sempre 202)
      security: []
      responses:
        '202':
          description: Solicitação aceita
  /api/v1/accounts/reset:
    post:
      operationId: resetPassword
      summary: Redefinir senha
      security: []
      responses:
        '200':
          description: Senha redefinida
components:
  responses:
    HealthUp:
      description: Processo disponível; não comprova integrações sandbox.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
    HealthUnavailable:
      description: Processo indisponível ou recusando tráfego.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
  headers:
    RequestId:
      description: UUID de correlação; X-Request-ID válido recebido é preservado, caso contrário gerado.
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DLSESSION
      description: >
        Sessão Spring Security persistida no PostgreSQL (D64). Nome do
        cookie provisório; definitivo em SPEC-identity (C14).
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        groups:
          type: array
          description: Nomes públicos dos grupos, presentes na raiz de health.
          items:
            type: string
            enum: [liveness, readiness]
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Status:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.0.1
    ProblemDetail:
      description: Erro padronizado (RFC 9457 + código comercial estável)
      type: object
      required: [title, status, codigo]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código comercial estável (ex. CHECKOUT_CONFLITO)
          example: RECURSO_NAO_ENCONTRADO
        correlationId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AccountResponse:
      type: object
      required: [id, email, emailVerified, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
    CsrfResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
