openapi: 3.1.0
info:
  title: De Lá do Pará API
  version: 0.0.1
  description: >
    Contrato canônico da API (C11). Toda operação HTTP implementada precisa
    estar aqui antes do código; o cliente Angular é gerado deste arquivo e
    nunca editado manualmente. Endpoints de negócio chegam com as specs
    (C15+); este seed prova o gate.
servers:
  - url: http://localhost:8080
    description: API local
security:
  - sessionCookie: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Saúde do processo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Processo está vivo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Processo aceita requisições
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Saúde pública da API
      # Endpoint público: sem sessão (exceção explícita ao padrão).
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: Indisponibilidade transitória
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/accounts:
    post:
      operationId: registerAccount
      summary: Criar conta opcional
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          headers:
            Location:
              schema:
                type: string
              description: URI da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions:
    post:
      operationId: login
      summary: Autenticar e criar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: DLSESSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Consultar sessão atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: logout
      summary: Encerrar sessão
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessão encerrada
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/csrf:
    get:
      operationId: getCsrf
      summary: Obter token CSRF
      security: []
      responses:
        '200':
          description: Token CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/v1/admin/producers:
    get:
      operationId: listAdminProducers
      summary: Listar produtores para gestão administrativa
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Página de produtores, incluindo inativos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProducerPage'}
        '400':
          description: Paginação inválida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      operationId: createAdminProducer
      summary: Criar produtor de demonstração
      description: Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProducerWrite'}
      responses:
        '201':
          description: Produtor criado
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/admin/producers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAdminProducer
      summary: Consultar produtor
      responses:
        '200':
          description: Produtor encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: UUID inválido
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produtor não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    patch:
      operationId: updateAdminProducer
      summary: Atualizar dados ou desativar produtor
      description: Corpo completo dos campos editáveis. Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProducerUpdate'}
      responses:
        '200':
          description: Produtor atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produtor não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/accounts/verify:
    post:
      operationId: verifyEmail
      summary: Verificar e-mail (placeholder C15 — verifica via token)
      security: []
      responses:
        '200':
          description: Verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /api/v1/accounts/recovery:
    post:
      operationId: requestRecovery
      summary: Solicitar recuperação (sempre 202)
      security: []
      responses:
        '202':
          description: Solicitação aceita
  /api/v1/accounts/reset:
    post:
      operationId: resetPassword
      summary: Redefinir senha
      security: []
      responses:
        '200':
          description: Senha redefinida
components:
  responses:
    HealthUp:
      description: Processo disponível; não comprova integrações sandbox.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
    HealthUnavailable:
      description: Processo indisponível ou recusando tráfego.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
  headers:
    RequestId:
      description: UUID de correlação; X-Request-ID válido recebido é preservado, caso contrário gerado.
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DLSESSION
      description: >
        Sessão Spring Security persistida no PostgreSQL (D64). Nome do
        cookie provisório; definitivo em SPEC-identity (C14).
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        groups:
          type: array
          description: Nomes públicos dos grupos, presentes na raiz de health.
          items:
            type: string
            enum: [liveness, readiness]
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Status:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.0.1
    ProblemDetail:
      description: Erro padronizado (RFC 9457 + código comercial estável)
      type: object
      required: [title, status, codigo]
      example:
        title: Erro
        status: 409
        detail: identificador já cadastrado
        codigo: CATALOG_002
        correlationId: 4b1e7c69-628c-4c81-92f7-f30d6821d30a
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código comercial estável (ex. CHECKOUT_CONFLITO)
          example: RECURSO_NAO_ENCONTRADO
        correlationId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AccountResponse:
      type: object
      required: [id, email, emailVerified, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
    CsrfResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ProducerWrite:
      type: object
      additionalProperties: false
      required: [slug, displayName, originLabel, description]
      example:
        slug: produto-demo
        displayName: Produtor de demonstração
        originLabel: Localidade ampla fictícia — demonstração
        description: Texto editorial fictício para demonstração.
      properties:
        slug: {type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        displayName: {type: string, minLength: 1, maxLength: 120}
        originLabel: {type: string, minLength: 1, maxLength: 300, description: 'Localidade ampla fictícia, rotulada como demonstração.'}
        description: {type: string, minLength: 1, maxLength: 2000, description: 'Texto editorial fictício, rotulado como demonstração.'}
    ProducerUpdate:
      type: object
      additionalProperties: false
      required: [slug, displayName, originLabel, description, active]
      example:
        slug: produto-demo
        displayName: Produtor de demonstração
        originLabel: Localidade ampla fictícia — demonstração
        description: Texto editorial fictício para demonstração.
        active: false
      properties:
        slug: {type: string, minLength: 1, maxLength: 80, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        displayName: {type: string, minLength: 1, maxLength: 120}
        originLabel: {type: string, minLength: 1, maxLength: 300, description: 'Localidade ampla fictícia, rotulada como demonstração.'}
        description: {type: string, minLength: 1, maxLength: 2000, description: 'Texto editorial fictício, rotulado como demonstração.'}
        active: {type: boolean}
    Producer:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, originLabel, description, demonstration, active, createdAt, updatedAt]
      example:
        id: 10c9f97b-4f7d-4eae-843f-1f227c7fbd45
        slug: produto-demo
        displayName: Produtor de demonstração
        originLabel: Localidade ampla fictícia — demonstração
        description: Texto editorial fictício para demonstração.
        demonstration: true
        active: true
        createdAt: '2026-09-21T12:00:00Z'
        updatedAt: '2026-09-21T12:00:00Z'
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        displayName: {type: string}
        originLabel: {type: string, description: 'Localidade ampla fictícia, rotulada como demonstração.'}
        description: {type: string, description: 'Texto editorial fictício, rotulado como demonstração.'}
        demonstration: {type: boolean, const: true}
        active: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ProducerPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      example:
        content:
          - id: 10c9f97b-4f7d-4eae-843f-1f227c7fbd45
            slug: produto-demo
            displayName: Produtor de demonstração
            originLabel: Localidade ampla fictícia — demonstração
            description: Texto editorial fictício para demonstração.
            demonstration: true
            active: true
            createdAt: '2026-09-21T12:00:00Z'
            updatedAt: '2026-09-21T12:00:00Z'
        page: 0
        size: 20
        totalElements: 1
        totalPages: 1
      properties:
        content:
          type: array
          items: {$ref: '#/components/schemas/Producer'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 50}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
