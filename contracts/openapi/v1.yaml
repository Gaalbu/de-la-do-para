openapi: 3.1.0
info:
  title: De Lá do Pará API
  version: 0.0.1
  description: >
    Contrato canônico da API (C11). Toda operação HTTP implementada precisa
    estar aqui antes do código; o cliente Angular é gerado deste arquivo e
    nunca editado manualmente. Endpoints de negócio chegam com as specs
    (C15+); este seed prova o gate.
servers:
  - url: http://localhost:8080
    description: API local
security:
  - sessionCookie: []
paths:
  /actuator/health:
    get:
      operationId: getHealth
      summary: Saúde do processo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/liveness:
    get:
      operationId: getLiveness
      summary: Processo está vivo
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /actuator/health/readiness:
    get:
      operationId: getReadiness
      summary: Processo aceita requisições
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthUp'
        '503':
          $ref: '#/components/responses/HealthUnavailable'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Saúde pública da API
      # Endpoint público: sem sessão (exceção explícita ao padrão).
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '500':
          description: Indisponibilidade transitória
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/accounts:
    post:
      operationId: registerAccount
      summary: Criar conta opcional
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada
          headers:
            Location:
              schema:
                type: string
              description: URI da conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions:
    post:
      operationId: login
      summary: Autenticar e criar sessão
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada
          headers:
            Set-Cookie:
              schema:
                type: string
              description: DLSESSION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Consultar sessão atual
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      operationId: logout
      summary: Encerrar sessão
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Sessão encerrada
        '401':
          description: Não autenticado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/csrf:
    get:
      operationId: getCsrf
      summary: Obter token CSRF
      security: []
      responses:
        '200':
          description: Token CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
  /api/v1/admin/producers:
    get:
      operationId: listAdminProducers
      summary: Listar produtores para gestão administrativa
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Página de produtores, incluindo inativos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProducerPage'}
        '400':
          description: Paginação inválida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      operationId: createAdminProducer
      summary: Criar produtor de demonstração
      description: Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProducerWrite'}
      responses:
        '201':
          description: Produtor criado
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/admin/producers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAdminProducer
      summary: Consultar produtor
      responses:
        '200':
          description: Produtor encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: UUID inválido
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produtor não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    patch:
      operationId: updateAdminProducer
      summary: Atualizar dados ou desativar produtor
      description: Corpo completo dos campos editáveis. Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProducerUpdate'}
      responses:
        '200':
          description: Produtor atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Producer'}
        '400':
          description: Dados inválidos
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produtor não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/admin/products:
    get:
      operationId: listAdminProducts
      summary: Listar produtos e variantes para gestão administrativa
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Página incluindo produtos e SKUs inativos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '400':
          description: Paginação inválida
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    post:
      operationId: createAdminProduct
      summary: Criar produto e seus SKUs de demonstração
      description: Cria o produto e variantes numa transação. Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductWrite'}
      responses:
        '201':
          description: Produto criado
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          description: Dados ou vínculo inválido
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug de produto ou código SKU já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/admin/products/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAdminProduct
      summary: Consultar produto e histórico de variantes
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          description: UUID inválido
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produto não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
    patch:
      operationId: updateAdminProduct
      summary: Atualizar ou desativar produto e variantes
      description: Corpo integral dos campos editáveis. SKUs omitidos são desativados sem exclusão física. Exige sessão DLSESSION e CSRF no cookie XSRF-TOKEN com o valor repetido no cabeçalho X-XSRF-TOKEN.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductUpdate'}
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400':
          description: Dados ou vínculo inválido
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '401':
          description: Sessão ausente ou expirada
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '403':
          description: Papel insuficiente ou CSRF ausente
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '404':
          description: Produto ou produtor não encontrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
        '409':
          description: Slug de produto ou código SKU já cadastrado
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/admin/products/{productId}/image:
    parameters:
      - in: path
        name: productId
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: putAdminProductImage
      summary: Definir ou substituir a imagem principal do produto
      description: JPEG ou PNG até 5 MiB; exige sessão administrativa e CSRF.
      x-csrf-required: true
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altText, source, license, rightsReviewed]
              properties:
                file: {type: string, format: binary}
                altText: {type: string, minLength: 1, maxLength: 250}
                source: {type: string, minLength: 1, maxLength: 1500}
                license: {type: string, minLength: 1, maxLength: 200}
                creator: {type: string, maxLength: 200}
                attribution: {type: string, maxLength: 500}
                rightsReviewed: {type: boolean, const: true}
      responses:
        '200': {description: Imagem substituída, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImage'}}}}
        '201': {description: Imagem criada, content: {application/json: {schema: {$ref: '#/components/schemas/ProductImage'}}}}
        '400': {description: Imagem ou metadados inválidos, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '401': {description: Sessão ausente ou expirada, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '403': {description: Papel insuficiente ou CSRF ausente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '404': {description: Produto não encontrado, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '413': {description: Arquivo acima de 5 MiB, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
    delete:
      operationId: deleteAdminProductImage
      summary: Remover a imagem principal do produto
      x-csrf-required: true
      responses:
        '204': {description: Imagem removida}
        '401': {description: Sessão ausente ou expirada, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '403': {description: Papel insuficiente ou CSRF ausente, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '404': {description: Imagem não encontrada, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
  /api/v1/product-images/{id}:
    get:
      operationId: getPublicProductImage
      summary: Baixar imagem principal de produto disponível
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Conteúdo JPEG ou PNG
          content:
            image/jpeg: {schema: {type: string, format: binary}}
            image/png: {schema: {type: string, format: binary}}
        '404': {description: Imagem ou produto não disponível, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
  /api/v1/products/{slug}:
    get:
      operationId: getPublicProduct
      summary: Consultar produto ativo e procedência de demonstração
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema: {type: string, minLength: 1, maxLength: 80}
      responses:
        '200':
          description: Produto ativo com produtor ativo e ao menos um SKU ativo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProduct'}
        '404':
          description: Produto não disponível
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
  /api/v1/accounts/verify:
    post:
      operationId: verifyEmail
      summary: Verificar e-mail (placeholder C15 — verifica via token)
      security: []
      responses:
        '200':
          description: Verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /api/v1/accounts/recovery:
    post:
      operationId: requestRecovery
      summary: Solicitar recuperação (sempre 202)
      security: []
      responses:
        '202':
          description: Solicitação aceita
  /api/v1/accounts/reset:
    post:
      operationId: resetPassword
      summary: Redefinir senha
      security: []
      responses:
        '200':
          description: Senha redefinida
  /api/v1/admin/inventory/skus/{skuId}/lots:
    get:
      operationId: listInventoryLots
      summary: Consultar lotes de um SKU
      parameters:
        - {$ref: '#/components/parameters/SkuId'}
      responses:
        '200':
          description: Lotes do SKU
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/InventoryLot'}}
    post:
      operationId: receiveInventoryLot
      summary: Registrar recebimento de lote
      parameters:
        - {$ref: '#/components/parameters/SkuId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryLotCreate'}
      responses:
        '200':
          description: Lote registrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLot'}
        '400': {$ref: '#/components/responses/Problem400'}
  /api/v1/admin/inventory/lots/{lotId}:
    patch:
      operationId: adjustInventoryLot
      summary: Ajustar saldo físico de lote
      parameters:
        - {$ref: '#/components/parameters/LotId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryAdjustment'}
      responses:
        '200':
          description: Lote ajustado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryLot'}
        '409': {$ref: '#/components/responses/Problem409'}

components:
  responses:
    Problem400:
      description: Dados inválidos
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    Problem409:
      description: Conflito de versão
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}
    HealthUp:
      description: Processo disponível; não comprova integrações sandbox.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: UP}
    HealthUnavailable:
      description: Processo indisponível ou recusando tráfego.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
        application/vnd.spring-boot.actuator.v3+json:
          schema:
            $ref: '#/components/schemas/Health'
          example: {status: OUT_OF_SERVICE}
  headers:
    RequestId:
      description: UUID de correlação; X-Request-ID válido recebido é preservado, caso contrário gerado.
      schema:
        type: string
        format: uuid
  parameters:
    SkuId:
      name: skuId
      in: path
      required: true
      schema: {type: string, format: uuid}
    LotId:
      name: lotId
      in: path
      required: true
      schema: {type: string, format: uuid}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DLSESSION
      description: >
        Sessão Spring Security persistida no PostgreSQL (D64). Nome do
        cookie provisório; definitivo em SPEC-identity (C14).
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        groups:
          type: array
          description: Nomes públicos dos grupos, presentes na raiz de health.
          items:
            type: string
            enum: [liveness, readiness]
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]
    Status:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.0.1
    ProblemDetail:
      description: Erro padronizado (RFC 9457 + código comercial estável)
      type: object
      required: [title, status, codigo]
      example:
        title: Erro
        status: 409
        detail: identificador já cadastrado
        codigo: CATALOG_002
        correlationId: 4b1e7c69-628c-4c81-92f7-f30d6821d30a
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        codigo:
          type: string
          description: Código comercial estável (ex. CHECKOUT_CONFLITO)
          example: RECURSO_NAO_ENCONTRADO
        correlationId:
          type: string
          format: uuid
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AccountResponse:
      type: object
      required: [id, email, emailVerified, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        role:
          type: string
          enum: [CUSTOMER, ADMIN]
    CsrfResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
    ProductCategory:
      type: string
      enum: [FOOD, CRAFT]
    ProductSkuWrite:
      type: object
      additionalProperties: false
      required: [skuCode, salesUnit, fragile, lengthMm, widthMm, heightMm, grossWeightGrams, active]
      properties:
        id: {type: string, format: uuid, description: 'Omitente para criar uma variante; enviar para atualizar uma variante existente.'}
        skuCode: {type: string, minLength: 1, maxLength: 80, pattern: '^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$'}
        salesUnit: {type: string, minLength: 1, maxLength: 40}
        netContentGrams: {type: [integer, 'null'], minimum: 1, description: 'Obrigatório para FOOD e nulo ou omitido para CRAFT.'}
        minimumShelfLifeDays: {type: [integer, 'null'], minimum: 1, description: 'Obrigatório para FOOD e nulo ou omitido para CRAFT.'}
        fragile: {type: boolean}
        lengthMm: {type: integer, minimum: 1}
        widthMm: {type: integer, minimum: 1}
        heightMm: {type: integer, minimum: 1}
        grossWeightGrams: {type: integer, minimum: 1}
        active: {type: boolean}
    ProductFields:
