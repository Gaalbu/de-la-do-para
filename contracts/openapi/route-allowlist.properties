# Rotas sem contrato: allowlist explícita (C11b)
#
# Formato: padrões separados por vírgula, ex.:
#   undocumentedAllowlist=/actuator/health,/actuator/info
# Regras:
# - Só endpoints de infraestrutura (health/readiness/métricas) entram aqui,
#   com justificativa em comentário. Regra de negócio sem contrato NUNCA.
# - O harness (RouteContractCoverageTest) falha se uma rota implementada não
#   estiver nem no contrato nem nesta lista.
# - Direção spec→implementação NÃO é exigida aqui: contrato vem antes do
#   código (contract-first); cada endpoint prova sua rota no próprio PR.
# - /error: BasicErrorController do Spring Boot (maquinaria de erro do
#   framework, sem regra comercial; Problem Details reais seguem D63/C11a).

undocumentedAllowlist=/error
