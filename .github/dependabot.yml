# C13b: atualizações semanais agrupadas; majors separados manualmente.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # Pacotes @angular/* exigem a mesma versão entre si (peer dependencies exatas).
      angular:
        patterns: ["@angular/*"]
        update-types: [minor, patch]
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
