# Ambiente local — De Lá do Pará (C08)
#
# Uso:
#   cp .env.example .env            # uma vez; nunca commitar o .env
#   docker compose --profile local up --build -d
#   docker compose --profile local ps
#   docker compose --profile local down        # preserva volumes/dados
#
# Portas do host são próprias do projeto (5432/6379/8080 já ocupados na
# máquina de referência). Imagens com tags fixas; sem `latest` flutuante.

name: de-la-do-para

services:
  postgres:
    image: postgres:18.6-bookworm
    profiles: ["local"]
    container_name: dlp-postgres
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deladopara}
      POSTGRES_USER: ${POSTGRES_USER:-deladopara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - dlp-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    profiles: ["local"]
    container_name: dlp-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-59092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-59092}:9092"
    volumes:
      - dlp-kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.2
    profiles: ["local"]
    container_name: dlp-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-11025}:1025"
      - "${MAILPIT_HTTP_PORT:-18025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2-alpine
    profiles: ["local"]
    container_name: dlp-wiremock
    restart: unless-stopped
    command: ["--global-response-templating", "--disable-gzip"]
    ports:
      - "${WIREMOCK_PORT:-18443}:8080"
    volumes:
      - ./infra/local/wiremock/mappings:/home/wiremock/mappings:ro
      - ./infra/local/wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dlp-pgdata:
  dlp-kafkadata:
