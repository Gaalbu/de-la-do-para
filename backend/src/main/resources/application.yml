spring:
  application:
    name: de-la-do-para-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
    cookie:
      name: DLSESSION
      http-only: true
      secure: true
      same-site: lax
      path: /
      max-age: 43200
  mail:
    host: localhost
    port: 11025
    properties:
      mail.smtp.auth: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.starttls.enable: false
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  media:
    directory: ${APP_MEDIA_DIRECTORY:./data/media}
  identity:
    bcrypt-strength: 12
    verification-token-ttl: PT30M
    verification-url: ${APP_IDENTITY_VERIFICATION_URL:https://localhost/verify-email}
    recovery-token-ttl: PT15M
    recovery-url: ${APP_IDENTITY_RECOVERY_URL:https://localhost/reset-password}
    mail-from: ${APP_IDENTITY_MAIL_FROM:no-reply@deladopara.local}

shipping:
  pickup-code-encryption-key: ${SHIPPING_PICKUP_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: true

---

spring:
  config:
    activate:
      on-profile: worker

app:
  eventing:
    publisher:
      bootstrap-servers: ${APP_EVENTING_BOOTSTRAP_SERVERS}
      topic: ${APP_EVENTING_TOPIC}
      lease: ${APP_EVENTING_LEASE}
      batch-size: ${APP_EVENTING_BATCH_SIZE}
      poll-delay: ${APP_EVENTING_POLL_DELAY}
      consumer-topic: ${APP_EVENTING_CONSUMER_TOPIC:events.inbound}
      consumer-group: ${APP_EVENTING_CONSUMER_GROUP:de-la-do-para}
    consumer:
      enabled: ${APP_EVENTING_CONSUMER_ENABLED:false}
      poll-delay: ${APP_EVENTING_CONSUMER_POLL_DELAY:PT0.5S}

payments:
  provider: ${PAYMENTS_PROVIDER:}
  worker:
    enabled: ${PAYMENTS_WORKER_ENABLED:false}
    batch-size: ${PAYMENTS_WORKER_BATCH_SIZE:10}
    poll-delay: ${PAYMENTS_WORKER_POLL_DELAY:PT1S}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
  mail:
    host: localhost
    port: 11025

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 3025
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
