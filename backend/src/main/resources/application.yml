spring:
  application:
    name: de-la-do-para-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
    cookie:
      name: DLSESSION
      http-only: true
      secure: true
      same-site: lax
      path: /
      max-age: 43200
  mail:
    host: ${NOTIFICATIONS_MAIL_HOST:localhost}
    port: ${NOTIFICATIONS_MAIL_PORT:11025}
    username: ${NOTIFICATIONS_MAIL_USERNAME:}
    password: ${NOTIFICATIONS_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${NOTIFICATIONS_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${NOTIFICATIONS_MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  data-encryption-key: ${APP_DATA_ENCRYPTION_KEY}
  media:
    directory: ${APP_MEDIA_DIRECTORY:./data/media}
  identity:
    bcrypt-strength: 12
    verification-ttl: ${IDENTITY_VERIFICATION_TTL:PT30M}
    recovery-ttl: ${IDENTITY_RECOVERY_TTL:PT15M}

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: true

---

spring:
  config:
    activate:
      on-profile: worker

app:
  eventing:
    publisher:
      bootstrap-servers: ${APP_EVENTING_BOOTSTRAP_SERVERS}
      topic: ${APP_EVENTING_TOPIC}
      lease: ${APP_EVENTING_LEASE}
      batch-size: ${APP_EVENTING_BATCH_SIZE}
      poll-delay: ${APP_EVENTING_POLL_DELAY}
      consumer-topic: ${APP_EVENTING_CONSUMER_TOPIC:events.inbound}
      consumer-group: ${APP_EVENTING_CONSUMER_GROUP:de-la-do-para}
    consumer:
      enabled: ${APP_EVENTING_CONSUMER_ENABLED:false}
      poll-delay: ${APP_EVENTING_CONSUMER_POLL_DELAY:PT0.5S}

payments:
  provider: ${PAYMENTS_PROVIDER:}
  worker:
    enabled: ${PAYMENTS_WORKER_ENABLED:false}
    batch-size: ${PAYMENTS_WORKER_BATCH_SIZE:10}
    poll-delay: ${PAYMENTS_WORKER_POLL_DELAY:PT1S}

identity:
  mail:
    worker:
      enabled: ${IDENTITY_MAIL_WORKER_ENABLED:false}
      batch-size: ${IDENTITY_MAIL_WORKER_BATCH_SIZE:10}
      poll-delay: ${IDENTITY_MAIL_WORKER_POLL_DELAY:PT2S}
      retry-delay: ${IDENTITY_MAIL_WORKER_RETRY_DELAY:PT30S}
      lease: ${IDENTITY_MAIL_WORKER_LEASE:PT2M}
    from: ${IDENTITY_MAIL_FROM:no-reply@deladopara.local}
    frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:4200}

notifications:
  mail:
    worker:
      enabled: ${ORDER_NOTIFICATIONS_MAIL_WORKER_ENABLED:false}
      batch-size: ${ORDER_NOTIFICATIONS_MAIL_WORKER_BATCH_SIZE:10}
      poll-delay: ${ORDER_NOTIFICATIONS_MAIL_WORKER_POLL_DELAY:PT2S}
      lease: ${ORDER_NOTIFICATIONS_MAIL_WORKER_LEASE:PT2M}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
  mail:
    host: localhost
    port: 11025

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 3025
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
