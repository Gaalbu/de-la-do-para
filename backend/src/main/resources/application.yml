spring:
  application:
    name: de-la-do-para-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 30m
  mail:
    host: localhost
    port: 11025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  identity:
    bcrypt-strength: 12

server:
  servlet:
    session:
      cookie:
        name: DLSESSION
        http-only: true
        secure: true
        same-site: lax
        path: /
        max-age: 12h

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: true
