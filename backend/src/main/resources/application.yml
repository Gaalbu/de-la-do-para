spring:
  application:
    name: de-la-do-para-backend
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 30m
    cookie:
      name: DLSESSION
      http-only: true
      secure: true
      same-site: lax
      path: /
      max-age: 43200
  mail:
    host: localhost
    port: 11025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  media:
    directory: ${APP_MEDIA_DIRECTORY:./data/media}
  identity:
    bcrypt-strength: 12
    verification-token-ttl: 30m
    recovery-token-ttl: 15m
    session:
      idle-timeout: 30m
      absolute-timeout: 12h
    mail-from: no-reply@deladopara.local
    mail-base-url: ${APP_BASE_URL:http://localhost:8080}
  base-url: ${APP_BASE_URL:http://localhost:8080}

logging:
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    db:
      enabled: true

---

spring:
  config:
    activate:
      on-profile: worker

app:
  eventing:
    publisher:
      bootstrap-servers: ${APP_EVENTING_BOOTSTRAP_SERVERS}
      topic: ${APP_EVENTING_TOPIC}
      lease: ${APP_EVENTING_LEASE}
      batch-size: ${APP_EVENTING_BATCH_SIZE}
      poll-delay: ${APP_EVENTING_POLL_DELAY}

---

spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:55432}/${POSTGRES_DB:deladopara}
    username: ${POSTGRES_USER:deladopara}
    password: ${POSTGRES_PASSWORD:deladopara}
  mail:
    host: localhost
    port: 11025

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 3025
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
